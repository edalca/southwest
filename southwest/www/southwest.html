<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Southwest</title>

		<base href="/" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#0f172a" />
		<meta
			name="viewport"
			content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<meta name="format-detection" content="telephone=no" />
		<meta name="msapplication-tap-highlight" content="no" />

		<link rel="shortcut icon" type="image/png" href="/favicon.png" />

		<!-- add to homescreen for ios -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Ionic App" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<script type="module" crossorigin src="/assets/southwest/frontend/assets/index-salrBYTD.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/southwest/frontend/assets/index-C-y41JaH.css">
	<link rel="manifest" href="/assets/southwest/frontend/manifest.webmanifest"></head>

	<body>
		<div id="app"></div>
		<script>
		  if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
			  navigator.serviceWorker.register('/sw.js', { scope: '/southwest/' })
				.catch(err => console.error("SW Registration failed:", err));
			});
		  }
		</script>
	
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
